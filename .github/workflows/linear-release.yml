# Third-party Actions are pinned to immutable commit SHAs (Aikido supply-chain policy).
name: Linear Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to dry-run sync (for example, v0.2.0)'
        required: true
        type: string
      base_ref:
        description: 'Optional exclusive scan base for a dry run (for example, v0.1.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  linear-release:
    name: Report release to Linear
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'
          case "${EVENT_NAME}" in
            release)
              tag="${RELEASE_TAG}"
              ;;
            workflow_dispatch)
              tag="${INPUT_VERSION}"
              ;;
            push)
              tag="${GITHUB_REF_NAME}"
              ;;
            *)
              echo "Unexpected event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          if [[ ! "${tag}" =~ ${TAG_RE} ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # Always check out the resolved tag: release events' github.sha can be
      # the target branch head rather than the tagged commit, and a bare
      # version could resolve to a same-named branch. refs/tags/ pins the
      # tag namespace; the tag must exist for dispatch dry runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.version.outputs.tag }}

      # Previous release tag becomes the exclusive scan base. With no earlier
      # v* tag the root commit is the base, so the first release scans every
      # commit except the root itself (<base>..HEAD is exclusive; the root
      # commit carries no issue/PR references).
      - name: Find previous release tag
        id: release_base
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          while IFS= read -r tag; do
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || continue
            [[ "${tag}" != "${TAG}" ]] || continue
            echo "base_ref=${tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          # versionsort.suffix=- ranks v0.2.0 above v0.2.0-rc.1 so stable
          # releases stay the base for later stable releases.
          done < <(git -c versionsort.suffix=- tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname)
          base=$(git rev-list --max-parents=0 HEAD | head -n1)
          echo "::notice title=linear-release::No previous v* tag; syncing from root commit ${base}."
          echo "base_ref=${base}" >> "${GITHUB_OUTPUT}"

      - name: Sync release commits and issues to Linear
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.version.outputs.tag }}
          base_ref: ${{ steps.release_base.outputs.base_ref || inputs.base_ref || '' }}
          issue_pattern: '(RM-\d+)'
          dry_run: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Complete release in Linear
        if: github.event_name == 'release'
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.tag }}
